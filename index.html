<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrina · Escáner de cartas</title>

<!--
  ══════════════════════════════════════════════════════════════════════
  GUÍA DE CONFIGURACIÓN — LEE ESTO ANTES DE USAR EL ARCHIVO
  ══════════════════════════════════════════════════════════════════════

  1) CREDENCIALES DE GOOGLE (obligatorio)
     Busca en el <script> de más abajo el bloque "CONFIGURACIÓN" y reemplaza:
       - CLIENT_ID: el Client ID OAuth 2.0 de tipo "Aplicación web".
       - FOLDER_ID: el ID de la carpeta de Drive donde guardas las imágenes
                    de las cartas (está en la URL de la carpeta en Drive:
                    https://drive.google.com/drive/folders/ESTE_ES_EL_ID).

     Pasos en Google Cloud Console (console.cloud.google.com):
       a. Crea o selecciona un proyecto.
       b. En "APIs y servicios > Biblioteca", activa "Google Drive API".
       c. En "APIs y servicios > Pantalla de consentimiento OAuth",
          configura el tipo (Externo/Interno) y agrega tu correo como
          usuario de prueba si el proyecto está en modo "Testing".
       d. En "APIs y servicios > Credenciales", crea unas credenciales de
          tipo "ID de cliente de OAuth 2.0" > "Aplicación web".
       e. En "Orígenes de JavaScript autorizados" agrega, por ejemplo:
            http://localhost:8000
            http://127.0.0.1:8000
            https://tu-dominio-final.com
          (localhost está exento del requisito de HTTPS solo para pruebas
          locales; en producción SÍ necesitas HTTPS).
       f. Copia el "Client ID" generado y pégalo en CLIENT_ID más abajo.

     El scope solicitado es 'drive.readonly' (solo lectura), suficiente
     para buscar y visualizar imágenes sin exponer ni modificar nada.

  2) CÓMO PROBARLO EN LOCAL
     Los navegadores exigen un "contexto seguro" para usar la cámara
     (getUserMedia), y Google Identity Services exige un origen
     autorizado. "localhost" cumple ambos requisitos sin necesidad de
     certificado HTTPS. Opciones simples para levantar un servidor local:

       Python 3:   python3 -m http.server 8000
       Node:       npx serve -l 8000
       VSCode:     extensión "Live Server"

     Luego abre http://localhost:8000 en el navegador (no abras el
     archivo con doble clic / file://, la cámara y el login de Google no
     funcionarán así).

  3) PRIVACIDAD
     - El video, la captura de imagen y el OCR (Tesseract.js) se procesan
       enteramente en el navegador del usuario. Ninguna imagen de la carta
       viaja a un servidor propio ni de terceros distinto de Google Drive.
     - Las imágenes encontradas en Drive se descargan como blob binario
       autenticado (Authorization: Bearer <token>) y se muestran con
       URL.createObjectURL; los archivos permanecen privados en Drive, no
       se cambian permisos ni se generan enlaces públicos.
  ══════════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#14151A;
    --ink-soft:#1E2027;
    --panel:#24262F;
    --case:#EFE6D8;
    --case-line:#C9BBA1;
    --gold:#D4AF37;
    --teal:#4FD1C5;
    --danger:#E2604F;
    --text-hi:#F3F1EC;
    --text-lo:#9A9CA8;
    --radius-lg:18px;
    --radius-sm:8px;
    --font-display:'Sora', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--ink);
    color:var(--text-hi);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 64px;
  }

  .app{
    width:100%;
    max-width:480px;
  }

  header.topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }

  header.topbar h1{
    font-size:1.15rem;
    font-weight:700;
    margin:0;
    letter-spacing:0.01em;
  }

  header.topbar .tag{
    font-family:var(--font-mono);
    font-size:0.68rem;
    color:var(--text-lo);
  }

  /* ── Tarjeta de conexión con Drive ────────────────────────────────── */

  .drive-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--panel);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    margin-bottom:18px;
    border:1px solid #2E3038;
  }

  .drive-status{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.82rem;
    color:var(--text-lo);
  }

  .status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--danger);
    flex-shrink:0;
    transition:background 0.25s ease;
  }

  .status-dot.connected{ background:var(--teal); }

  button{
    font-family:var(--font-display);
    font-weight:600;
    border:none;
    cursor:pointer;
    border-radius:var(--radius-sm);
    transition:transform 0.12s ease, opacity 0.12s ease;
  }
  button:active{ transform:scale(0.97); }
  button:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }

  .btn-ghost{
    background:transparent;
    border:1px solid #3A3D48;
    color:var(--text-hi);
    padding:8px 14px;
    font-size:0.78rem;
  }

  /* ── Visor de cámara ──────────────────────────────────────────────── */

  .scanner{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#000;
    border-radius:var(--radius-lg);
    overflow:hidden;
    border:1px solid #2E3038;
  }

  video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scaleX(var(--mirror, 1));
  }

  .scanner .no-camera{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    color:var(--text-lo);
    font-size:0.85rem;
  }

  /* guía visual con proporción de carta de coleccionable (63:88) */
  .card-guide{
    position:absolute;
    top:50%;
    left:50%;
    width:72%;
    aspect-ratio:63/88;
    transform:translate(-50%,-50%);
    border:2px solid var(--gold);
    border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,0.45);
    pointer-events:none;
  }

  .card-guide::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:6%;
    height:20%;
    border:1px dashed rgba(212,175,55,0.75);
    border-radius:6px;
  }

  .card-guide .hint{
    position:absolute;
    left:8%;
    top:6%;
    transform:translateY(-135%);
    font-family:var(--font-mono);
    font-size:0.62rem;
    color:var(--gold);
    letter-spacing:0.03em;
  }

  .scan-flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .scan-flash.fire{
    animation:flash 0.35s ease-out;
  }
  @keyframes flash{
    0%{ opacity:0.85; }
    100%{ opacity:0; }
  }

  /* ── Controles bajo el visor ──────────────────────────────────────── */

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }

  .btn-scan{
    flex:1;
    background:var(--gold);
    color:#1A1712;
    padding:14px 16px;
    font-size:0.92rem;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .btn-icon{
    width:46px;
    height:46px;
    flex-shrink:0;
    background:var(--panel);
    border:1px solid #3A3D48;
    color:var(--text-hi);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.05rem;
  }

  /* ── Loaders ──────────────────────────────────────────────────────── */

  .progress-line{
    height:3px;
    width:100%;
    background:#2E3038;
    border-radius:3px;
    overflow:hidden;
    margin-top:12px;
    display:none;
  }
  .progress-line.active{ display:block; }
  .progress-line .bar{
    height:100%;
    width:36%;
    background:var(--teal);
    border-radius:3px;
    animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{
    0%{ transform:translateX(-120%); }
    100%{ transform:translateX(340%); }
  }

  .stage-label{
    font-family:var(--font-mono);
    font-size:0.68rem;
    color:var(--text-lo);
    margin-top:6px;
    min-height:14px;
  }

  /* ── Campo de búsqueda ────────────────────────────────────────────── */

  .search-block{
    margin-top:26px;
  }

  .search-block label{
    display:block;
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-lo);
    margin-bottom:6px;
  }

  .search-row{
    display:flex;
    gap:8px;
  }

  .search-row input{
    flex:1;
    background:var(--panel);
    border:1px solid #3A3D48;
    border-radius:var(--radius-sm);
    padding:12px 14px;
    color:var(--text-hi);
    font-family:var(--font-mono);
    font-size:0.9rem;
  }
  .search-row input:focus{
    outline:none;
    border-color:var(--teal);
  }

  .btn-search{
    background:var(--teal);
    color:#0B211E;
    padding:0 18px;
    font-size:0.85rem;
  }

  /* ── Panel de resultado (la "vitrina") ────────────────────────────── */

  .result{
    margin-top:24px;
    background:var(--case);
    border-radius:var(--radius-lg);
    padding:18px;
    color:#2A2416;
    min-height:120px;
    display:none;
  }
  .result.active{ display:block; }

  .result-empty{
    text-align:center;
    padding:20px 10px;
    color:#7A6F55;
    font-size:0.88rem;
  }

  .result-hit{
    display:flex;
    gap:14px;
  }

  .result-hit img{
    width:96px;
    aspect-ratio:63/88;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--case-line);
    background:#fff;
  }

  .result-meta h3{
    margin:0 0 4px;
    font-size:1rem;
  }

  .result-meta .file-tag{
    font-family:var(--font-mono);
    font-size:0.68rem;
    color:#7A6F55;
    word-break:break-all;
  }

  .result-list-note{
    margin-top:10px;
    font-size:0.72rem;
    color:#7A6F55;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translate(-50%, 12px);
    background:#2A2C34;
    border:1px solid #3A3D48;
    color:var(--text-hi);
    padding:11px 16px;
    border-radius:var(--radius-sm);
    font-size:0.82rem;
    max-width:90%;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .toast.error{ border-color:var(--danger); }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1>Vitrina</h1>
    <span class="tag">escáner de cartas · v1</span>
  </header>

  <div class="drive-strip">
    <div class="drive-status">
      <span class="status-dot" id="driveDot"></span>
      <span id="driveStatusText">Drive no conectado</span>
    </div>
    <button class="btn-ghost" id="btnConnectDrive" type="button">Conectar con Google Drive</button>
  </div>

  <div class="scanner" id="scannerBox">
    <video id="video" autoplay playsinline muted></video>
    <div class="no-camera" id="noCameraMsg" style="display:none;">
      No se pudo acceder a la cámara. Revisa los permisos del navegador
      y que la página se sirva por http://localhost o https.
    </div>
    <div class="card-guide">
      <span class="hint">nombre aquí ↑</span>
    </div>
    <div class="scan-flash" id="scanFlash"></div>
  </div>

  <div class="controls">
    <button class="btn-icon" id="btnToggleCam" type="button" title="Cambiar cámara">⟲</button>
    <button class="btn-scan" id="btnScan" type="button">
      <span>Escanear carta</span>
    </button>
  </div>

  <div class="progress-line" id="ocrProgress"><div class="bar"></div></div>
  <div class="stage-label" id="stageLabel"></div>

  <div class="search-block">
    <label for="searchInput">Nombre detectado (editable)</label>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Ej: Pikachu, Charizard...">
      <button class="btn-search" id="btnSearch" type="button">Buscar</button>
    </div>
  </div>

  <div class="result" id="resultBox">
    <!-- contenido inyectado por JS -->
  </div>

</div>

<div class="toast" id="toast"></div>

<canvas id="captureCanvas" style="display:none;"></canvas>
<canvas id="cropCanvas" style="display:none;"></canvas>

<!-- Tesseract.js: OCR 100% en el navegador, ninguna imagen sale del cliente -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<!-- Google Identity Services: flujo OAuth 2.0 sin exponer claves secretas -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
(() => {
  "use strict";

  /* ════════════════════════════════════════════════════════════════
     CONFIGURACIÓN — reemplaza estos dos valores con los tuyos
     ════════════════════════════════════════════════════════════════ */
  const CLIENT_ID = "TU_CLIENT_ID_DE_GOOGLE.apps.googleusercontent.com";
  const FOLDER_ID = "TU_FOLDER_ID_DE_DRIVE";
  const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";
  /* ════════════════════════════════════════════════════════════════ */

  // ── Referencias DOM ────────────────────────────────────────────────
  const video          = document.getElementById("video");
  const noCameraMsg    = document.getElementById("noCameraMsg");
  const scannerBox     = document.getElementById("scannerBox");
  const scanFlash      = document.getElementById("scanFlash");
  const btnScan        = document.getElementById("btnScan");
  const btnToggleCam   = document.getElementById("btnToggleCam");
  const ocrProgress    = document.getElementById("ocrProgress");
  const stageLabel     = document.getElementById("stageLabel");
  const searchInput    = document.getElementById("searchInput");
  const btnSearch      = document.getElementById("btnSearch");
  const resultBox      = document.getElementById("resultBox");
  const btnConnectDrive= document.getElementById("btnConnectDrive");
  const driveDot       = document.getElementById("driveDot");
  const driveStatusText= document.getElementById("driveStatusText");
  const captureCanvas  = document.getElementById("captureCanvas");
  const cropCanvas     = document.getElementById("cropCanvas");
  const toast          = document.getElementById("toast");

  // ── Estado ──────────────────────────────────────────────────────────
  let currentStream = null;
  let facingMode = "environment"; // "environment" = trasera, "user" = frontal
  let tokenClient = null;
  let accessToken = null;

  // ── Utilidades de UI ─────────────────────────────────────────────────
  function showToast(msg, isError = false){
    toast.textContent = msg;
    toast.classList.toggle("error", isError);
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 3200);
  }

  function setStage(text){
    stageLabel.textContent = text || "";
  }

  function setLoading(on, label){
    ocrProgress.classList.toggle("active", on);
    setStage(on ? (label || "") : "");
    btnScan.disabled = on;
    btnSearch.disabled = on;
  }

  // ── Cámara ────────────────────────────────────────────────────────
  async function startCamera(){
    if (currentStream){
      currentStream.getTracks().forEach(t => t.stop());
    }
    try{
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = currentStream;
      video.style.setProperty("--mirror", facingMode === "user" ? "-1" : "1");
      noCameraMsg.style.display = "none";
      video.style.display = "block";
    }catch(err){
      console.error("No se pudo abrir la cámara:", err);
      noCameraMsg.style.display = "flex";
      video.style.display = "none";
      showToast("No se pudo acceder a la cámara.", true);
    }
  }

  btnToggleCam.addEventListener("click", () => {
    facingMode = facingMode === "environment" ? "user" : "environment";
    startCamera();
  });

  // ── Captura + recorte de la zona del nombre ─────────────────────────
  // Se toma el fotograma completo y se recorta solo la franja superior
  // del recuadro guía (donde normalmente va el nombre del Pokémon), para
  // que Tesseract no se distraiga con el arte de la carta ni los textos
  // de ataques/reglas.
  function captureCroppedFrame(){
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;

    captureCanvas.width = vw;
    captureCanvas.height = vh;
    const ctx = captureCanvas.getContext("2d");
    if (facingMode === "user"){
      ctx.translate(vw, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, vw, vh);

    // Estas proporciones deben calzar con el CSS de .card-guide y su ::before
    const guideWidthRatio  = 0.72;
    const guideHeightRatio = guideWidthRatio * (88 / 63) * (vw / vh);
    const guideW = vw * guideWidthRatio;
    const guideH = vh * Math.min(guideHeightRatio, 1);
    const guideX = (vw - guideW) / 2;
    const guideY = (vh - guideH) / 2;

    const nameX = guideX + guideW * 0.08;
    const nameY = guideY + guideH * 0.06;
    const nameW = guideW * 0.84;
    const nameH = guideH * 0.20;

    cropCanvas.width = nameW;
    cropCanvas.height = nameH;
    const cctx = cropCanvas.getContext("2d");
    cctx.drawImage(captureCanvas, nameX, nameY, nameW, nameH, 0, 0, nameW, nameH);

    return cropCanvas.toDataURL("image/png");
  }

  // ── Limpieza del texto OCR ───────────────────────────────────────────
  // Quita saltos de línea, símbolos raros y valores de HP típicos de una
  // carta ("HP90", "90 HP", "PS 90"), dejando solo el nombre.
  function cleanOcrText(raw){
    if (!raw) return "";
    let t = raw.replace(/\r?\n/g, " ");
    t = t.replace(/\b(HP|PS)\s*\d{1,3}\b/gi, " ");
    t = t.replace(/\b\d{1,3}\s*(HP|PS)\b/gi, " ");
    t = t.replace(/[^a-zA-ZÀ-ÿ0-9\s'.-]/g, " ");
    t = t.replace(/\s+/g, " ").trim();
    // Nos quedamos con las primeras 3 palabras: el nombre rara vez es más largo
    t = t.split(" ").slice(0, 3).join(" ");
    return t;
  }

  async function runOcr(dataUrl){
    setLoading(true, "Leyendo el nombre de la carta…");
    try{
      const { data } = await Tesseract.recognize(dataUrl, "spa+eng", {
        logger: () => {} // silencioso; el loader de la UI ya informa el progreso
      });
      const clean = cleanOcrText(data.text);
      if (clean){
        searchInput.value = clean;
        showToast(`Detectado: "${clean}"`);
      }else{
        showToast("No se detectó texto legible. Puedes escribirlo a mano.", true);
      }
    }catch(err){
      console.error("Error de OCR:", err);
      showToast("Ocurrió un error leyendo la carta.", true);
    }finally{
      setLoading(false);
    }
  }

  btnScan.addEventListener("click", () => {
    const dataUrl = captureCroppedFrame();
    if (!dataUrl){
      showToast("La cámara aún no está lista.", true);
      return;
    }
    scanFlash.classList.remove("fire");
    void scanFlash.offsetWidth; // reinicia la animación
    scanFlash.classList.add("fire");
    runOcr(dataUrl);
  });

  // ── Google Identity Services / OAuth ─────────────────────────────────
  function ensureTokenClient(){
    if (tokenClient) return tokenClient;
    if (!window.google || !google.accounts || !google.accounts.oauth2){
      throw new Error("Google Identity Services todavía no ha cargado.");
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp) => {
        if (resp.error){
          console.error("Error de OAuth:", resp);
          showToast("No se pudo conectar con Google Drive.", true);
          return;
        }
        accessToken = resp.access_token;
        driveDot.classList.add("connected");
        driveStatusText.textContent = "Drive conectado";
        btnConnectDrive.textContent = "Reconectar";
        showToast("Conectado a Google Drive.");
      }
    });
    return tokenClient;
  }

  btnConnectDrive.addEventListener("click", () => {
    try{
      const client = ensureTokenClient();
      client.requestAccessToken({ prompt: accessToken ? "" : "consent" });
    }catch(err){
      console.error(err);
      showToast("Google Identity Services aún está cargando, intenta de nuevo en un segundo.", true);
    }
  });

  // ── Búsqueda en Drive ────────────────────────────────────────────────
  function renderResultEmpty(query){
    resultBox.classList.add("active");
    resultBox.innerHTML = `
      <div class="result-empty">
        No se encontró ninguna carta que coincida con "<strong>${escapeHtml(query)}</strong>"
        en la carpeta configurada.
      </div>`;
  }

  function renderResultHit(file, blobUrl, extraCount){
    resultBox.classList.add("active");
    resultBox.innerHTML = `
      <div class="result-hit">
        <img src="${blobUrl}" alt="Carta encontrada: ${escapeHtml(file.name)}">
        <div class="result-meta">
          <h3>${escapeHtml(file.name)}</h3>
          <div class="file-tag">ID: ${escapeHtml(file.id)}</div>
        </div>
      </div>
      ${extraCount > 0 ? `<div class="result-list-note">+ ${extraCount} coincidencia(s) adicional(es) en la carpeta.</div>` : ""}
    `;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function searchInDrive(query){
    if (!accessToken){
      showToast("Primero conecta tu cuenta de Google Drive.", true);
      return;
    }
    if (!query){
      showToast("Escribe o escanea un nombre antes de buscar.", true);
      return;
    }
    if (FOLDER_ID.startsWith("TU_")){
      showToast("Falta configurar FOLDER_ID en el script.", true);
      return;
    }

    setLoading(true, "Buscando en Google Drive…");
    resultBox.classList.remove("active");

    try{
      // Comillas simples escapadas: Drive usa \' dentro del literal de búsqueda
      const safeQuery = query.replace(/'/g, "\\'");
      const q = `'${FOLDER_ID}' in parents and mimeType contains 'image/' and name contains '${safeQuery}' and trashed = false`;

      const params = new URLSearchParams({
        q,
        fields: "files(id,name,mimeType)",
        pageSize: "10",
        spaces: "drive"
      });

      const listResp = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });

      if (listResp.status === 401){
        // token expirado: se pide uno nuevo y se reintenta una vez
        accessToken = null;
        driveDot.classList.remove("connected");
        driveStatusText.textContent = "Drive no conectado";
        showToast("La sesión de Drive expiró, vuelve a conectar.", true);
        return;
      }
      if (!listResp.ok){
        throw new Error(`Drive respondió ${listResp.status}`);
      }

      const listData = await listResp.json();
      const files = listData.files || [];

      if (files.length === 0){
        renderResultEmpty(query);
        return;
      }

      // Descarga el binario de la primera coincidencia como blob autenticado,
      // sin exponer un enlace público del archivo.
      setStage("Descargando imagen desde Drive…");
      const first = files[0];
      const fileResp = await fetch(
        `https://www.googleapis.com/drive/v3/files/${first.id}?alt=media`,
        { headers: { Authorization: `Bearer ${accessToken}` } }
      );
      if (!fileResp.ok){
        throw new Error(`No se pudo descargar el archivo (${fileResp.status})`);
      }
      const blob = await fileResp.blob();
      const blobUrl = URL.createObjectURL(blob);

      renderResultHit(first, blobUrl, files.length - 1);
    }catch(err){
      console.error("Error buscando en Drive:", err);
      showToast("Ocurrió un error buscando en Google Drive.", true);
    }finally{
      setLoading(false);
    }
  }

  btnSearch.addEventListener("click", () => searchInDrive(searchInput.value.trim()));
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") searchInDrive(searchInput.value.trim());
  });

  // ── Arranque ──────────────────────────────────────────────────────
  startCamera();
})();
</script>
